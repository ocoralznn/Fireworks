name: Publish to Modrinth
on:
  release:
    types: [published]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update pack version
        run: |
          jq --arg version "${{ github.event.release.tag_name }}" '.pack.description[7].text = $version' pack.mcmeta > pack.mcmeta.tmp && mv pack.mcmeta.tmp pack.mcmeta

      - name: Zip Datapack
        run: zip -r Fireworks-DP_v${{ github.event.release.tag_name }}.zip . -x ".github/*" ".git/*" "*.yml" "README.md" "assets/*" # Package data files into .zip

      - name: Zip Resourcepack
        run: zip -r Fireworks-RP_v${{ github.event.release.tag_name }}.zip . -x ".github/*" ".git/*" "*.yml" "README.md" "data/*" "Fireworks-DP_v${{ github.event.release.tag_name }}.zip" # Package asset files into .zip

      - name: Upload to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: "yFGB1mRk"
          name: ${{ github.event.release.name }}
          version: ${{ github.event.release.tag_name }}
          changelog: ${{ github.event.release.body }}
          files: |-
            Fireworks-DP_v${{ github.event.release.tag_name }}.zip
            Fireworks-RP_v${{ github.event.release.tag_name }}.zip
          primary-file: Fireworks-DP_v${{ github.event.release.tag_name }}.zip
          file-types: Fireworks-RP_v${{ github.event.release.tag_name }}.zip=optional-resource-pack
          loaders: "datapack"
          game-versions: |-
            26.2
          channel: ${{ github.event.release.prerelease && 'beta' || 'release' }}

      - name: Send Discord notification
        run: |
          curl -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg body "${{ github.event.release.body }}" \
              --arg name "${{ github.event.release.name }}" \
              '{
                "content": $body,
                "embeds": [],
                "components": [
                  {
                    "type": 1,
                    "components": [
                      {
                        "type": 2,
                        "style": 5,
                        "label": "Download",
                        "url": "https://modrinth.com/datapack/fireworks-from-choir/",
                        "disabled": false,
                        "emoji": {
                          "name": "📦"
                        }
                      }
                    ]
                  }
                ],
                "thread_name": $name
              }'
            )"
