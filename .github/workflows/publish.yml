name: Publish to Modrinth
on:
  release:
    types: [published]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zip Datapack
        run: zip -r Fireworks.zip . -x ".github/*" ".git/*" "*.yml" "README.md" "assets/*" # Package data files into .zip

      - name: Zip Resourcepack
        run: zip -r Fireworks-translation.zip . -x ".github/*" ".git/*" "*.yml" "README.md" "data/*" "Fireworks.zip" # Package asset files into .zip

      - name: Upload to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: "yFGB1mRk"
          name: ${{ github.event.release.name }}
          version: ${{ github.event.release.tag_name }}
          changelog: ${{ github.event.release.body }}
          files: |-
            Fireworks.zip
            Fireworks-translation.zip
          primary-file: Fireworks.zip
          file-types: Fireworks-translation.zip=optional-resource-pack
          loaders: "datapack"
          game-versions: |-
            26.2-pre-2
          channel: "release"
